tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 67f55f8fc0a23eb65fa5ff53
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact's name
            example: Kate Poly
          phoneNumber:
            type: string
            description: Contact's phone number
            example: '+380507777777'
          email:
            type: string
            description: Contact's email
            example: kp@gmail.com
          isFavourite:
            type: boolean
            description: Whether is contact favourite
            example: false
          contactType:
            type: string
            description: Contact's marker. Should be between parameters
            enum:
              - work
              - home
              - personal
          photo:
            type: string
            description: Link to contact photo
            format: binary
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact with id 67f55f8fc0a23eb65fa5ff53!
            data:
              type: object
              properties:
                name:
                  type: string
                  description: Contact's name
                  example: Kate Poly
                phoneNumber:
                  type: string
                  description: Contact's phone number
                  example: '+380507777777'
                email:
                  type: string
                  description: Contact's email
                  example: kp@gmail.com
                isFavourite:
                  type: boolean
                  description: Whether is contact favourite
                  example: true
                  default: false
                contactType:
                  type: string
                  description: Contact's marker. Should be between parameters
                  enum:
                    - work
                    - home
                    - personal
                photo:
                  type: string
                  description: Link to contact photo
                  example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml

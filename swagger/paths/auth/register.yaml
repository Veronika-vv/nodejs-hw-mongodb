tags:
  - Auth
summary: Register new user
operationId: registerUser
description: Register a new user with name, email, and password
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            example: Kate Poly
          email:
            type: string
            format: email
            example: kp@gmail.com
          password:
            type: string
            format: password
            example: Password123
responses:
  '201':
    description: User registered successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              properties:
                id:
                  type: string
                  example: 67f55f8fc0a23eb65fa5ff53
                name:
                  type: string
                  example: Kate Poly
                email:
                  type: string
                  example: kp@gmail.com
                token:
                  type: string
                  example: jwt-token-string
  '400':
    description: Bad request (missing or invalid fields)
    $ref: ../../components/responses/400.yaml
  '409':
    description: User with this email already exists
    $ref: ../../components/responses/409.yaml
